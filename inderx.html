<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Online - Công Cụ Tính Toán Nhanh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">

    <div id="decoy-screen" class="bg-white p-6 rounded-2xl shadow-xl w-80 border border-gray-200">
        <div class="text-xs text-gray-400 mb-1 text-right">Casio FX-Web</div>
        <input id="calc-display" type="text" readonly value="0" 
            class="w-full bg-gray-100 text-right text-3xl font-mono p-4 rounded-lg mb-4 border border-gray-300 focus:outline-none">
        
        <div class="grid grid-cols-4 gap-2 text-lg font-semibold">
            <button onclick="clearCalc()" class="col-span-2 bg-red-100 text-red-600 p-3 rounded-lg hover:bg-red-200">AC</button>
            <button onclick="pressCalc('/')" class="bg-gray-200 p-3 rounded-lg hover:bg-gray-300">÷</button>
            <button onclick="pressCalc('*')" class="bg-gray-200 p-3 rounded-lg hover:bg-gray-300">×</button>
            <button onclick="pressCalc('7')" class="bg-gray-50 border p-3 rounded-lg hover:bg-gray-100">7</button>
            <button onclick="pressCalc('8')" class="bg-gray-50 border p-3 rounded-lg hover:bg-gray-100">8</button>
            <button onclick="pressCalc('9')" class="bg-gray-50 border p-3 rounded-lg hover:bg-gray-100">9</button>
            <button onclick="pressCalc('-')" class="bg-gray-200 p-3 rounded-lg hover:bg-gray-300">-</button>
            <button onclick="pressCalc('4')" class="bg-gray-50 border p-3 rounded-lg hover:bg-gray-100">4</button>
            <button onclick="pressCalc('5')" class="bg-gray-50 border p-3 rounded-lg hover:bg-gray-100">5</button>
            <button onclick="pressCalc('6')" class="bg-gray-50 border p-3 rounded-lg hover:bg-gray-100">6</button>
            <button onclick="pressCalc('+')" class="bg-gray-200 p-3 rounded-lg hover:bg-gray-300">+</button>
            <button onclick="pressCalc('1')" class="bg-gray-50 border p-3 rounded-lg hover:bg-gray-100">1</button>
            <button onclick="pressCalc('2')" class="bg-gray-50 border p-3 rounded-lg hover:bg-gray-100">2</button>
            <button onclick="pressCalc('3')" class="bg-gray-50 border p-3 rounded-lg hover:bg-gray-100">3</button>
            <button onclick="solveCalc()" class="row-span-2 bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700">=</button>
            <button onclick="pressCalc('0')" class="col-span-2 bg-gray-50 border p-3 rounded-lg hover:bg-gray-100">0</button>
            <button onclick="pressCalc('.')" class="bg-gray-50 border p-3 rounded-lg hover:bg-gray-100">.</button>
        </div>
    </div>

    <div id="ghost-screen" class="hidden bg-zinc-950 text-green-400 p-6 rounded-xl shadow-2xl w-full max-w-2xl border border-green-500/30 font-mono">
        <div class="flex justify-between items-center border-b border-green-500/30 pb-4 mb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-wider text-green-500 flex items-center gap-2">
                    GHOSTDROP <span class="text-xs bg-green-950 text-green-400 px-2 py-1 rounded border border-green-500/40">WS:// RAM-ONLY</span>
                </h1>
                <p class="text-xs text-zinc-400 mt-1">Giao thức: WebSocket Realtime | Lưu trữ: Bộ nhớ RAM khả biến</p>
            </div>
            <div class="flex gap-2">
                <a href="/visualizer.html" target="_blank" class="bg-blue-950 hover:bg-blue-900 text-blue-300 px-3 py-2 rounded text-xs border border-blue-500/40">
                    Xem Minh Họa
                </a>
                <button onclick="lockScreen()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-2 rounded text-xs border border-zinc-600">
                    Ngụy trang (ESC)
                </button>
                <button onclick="nukeData()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded text-xs shadow-lg shadow-red-600/30 animate-pulse">
                    XÓA SẠCH RAM
                </button>
            </div>
        </div>

        <div class="flex gap-2 mb-4 bg-zinc-900 p-3 rounded-lg border border-zinc-800 items-center">
            <span class="text-xs text-zinc-400">Mã Phiên (Room):</span>
            <input id="room-input" type="text" value="nhom-10-secret" 
                class="bg-black text-green-400 px-3 py-1 rounded border border-zinc-700 text-sm flex-1 focus:outline-none focus:border-green-500">
            <button onclick="joinRoom()" class="bg-green-700 hover:bg-green-600 text-white px-3 py-1 rounded text-xs font-bold">
                Đổi Phiên
            </button>
        </div>

        <div id="data-list" class="bg-black/80 h-72 overflow-y-auto p-4 rounded-lg border border-zinc-800 mb-4 space-y-3"></div>

        <div class="space-y-3 bg-zinc-900 p-4 rounded-lg border border-zinc-800">
            <textarea id="msg-input" rows="2" placeholder="Nhập dữ liệu mật cần bắn qua WebSocket vào RAM..." 
                class="w-full bg-black text-green-300 p-3 rounded border border-zinc-700 text-sm focus:outline-none focus:border-green-500"></textarea>
            
            <div class="flex justify-between items-center">
                <input id="file-input" type="file" class="text-xs text-zinc-400 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:bg-zinc-800 file:text-green-400 hover:file:bg-zinc-700">
                <button onclick="sendData()" class="bg-green-600 hover:bg-green-500 text-black font-bold px-6 py-2 rounded text-sm">
                    Truyền Frame lên RAM
                </button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const SECRET_PIN = "1337";
        let calcExp = "";

        function pressCalc(val) {
            if (calcExp === "0") calcExp = "";
            calcExp += val;
            document.getElementById('calc-display').value = calcExp;
        }
        function clearCalc() {
            calcExp = "";
            document.getElementById('calc-display').value = "0";
        }
        function solveCalc() {
            if (calcExp === SECRET_PIN) {
                clearCalc();
                document.body.className = "bg-zinc-900 min-h-screen flex items-center justify-center p-4";
                document.getElementById('decoy-screen').classList.add('hidden');
                document.getElementById('ghost-screen').classList.remove('hidden');
                document.title = "GhostDrop // WebSocket RAM Session";
                joinRoom();
                return;
            }
            try {
                calcExp = String(eval(calcExp));
                document.getElementById('calc-display').value = calcExp;
            } catch {
                document.getElementById('calc-display').value = "Error";
                calcExp = "";
            }
        }
        function lockScreen() {
            document.body.className = "bg-gray-100 min-h-screen flex items-center justify-center font-sans";
            document.getElementById('ghost-screen').classList.add('hidden');
            document.getElementById('decoy-screen').classList.remove('hidden');
            document.title = "Máy Tính Online - Công Cụ Tính Toán Nhanh";
        }
        document.addEventListener('keydown', e => { if (e.key === "Escape") lockScreen(); });

        function getRoom() {
            return document.getElementById('room-input').value.trim() || 'nhom-10-secret';
        }
        function joinRoom() {
            socket.emit('join-room', getRoom());
        }

        socket.on('sync-ram', (items) => {
            const container = document.getElementById('data-list');
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="text-center text-zinc-600 text-xs py-24">[RAM TRỐNG] Toàn bộ dữ liệu trong phiên đã bị hủy hoặc chưa khởi tạo.</div>';
                return;
            }
            container.innerHTML = items.map(item => {
                const textHtml = item.text ? '<p class="text-green-300 whitespace-pre-wrap text-sm mb-2">' + escapeHtml(item.text) + '</p>' : '';
                const fileHtml = item.fileData ? '<div class="mt-2 pt-2 border-t border-zinc-800 flex items-center justify-between"><span class="text-amber-400">File trên RAM: ' + escapeHtml(item.fileName) + '</span><a href="' + item.fileData + '" download="' + item.fileName + '" class="bg-green-900/60 hover:bg-green-800 text-green-300 px-2 py-1 rounded border border-green-500/30">Tải về máy</a></div>' : '';
                return '<div class="bg-zinc-900/90 p-3 rounded border border-green-500/20 text-xs"><div class="flex justify-between text-zinc-500 mb-1"><span>Node: #' + item.sender + ' | ID: ' + item.id + '</span><span>' + item.time + '</span></div>' + textHtml + fileHtml + '</div>';
            }).join('');
            container.scrollTop = container.scrollHeight;
        });

        async function sendData() {
            const room = getRoom();
            const text = document.getElementById('msg-input').value.trim();
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];

            if (!text && !file) return alert('Nhập tin nhắn hoặc chọn file!');

            let fileData = null, fileName = null;
            if (file) {
                fileName = file.name;
                fileData = await toBase64(file);
            }

            socket.emit('push-to-ram', { room, text, fileName, fileData });
            document.getElementById('msg-input').value = '';
            fileInput.value = '';
        }

        function nukeData() {
            socket.emit('nuke-ram', getRoom());
        }

        const toBase64 = file => new Promise((res, rej) => {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = () => res(r.result);
            r.onerror = e => rej(e);
        });
        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
        }
    </script>
</body>
</html>
